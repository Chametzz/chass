<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chass</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="chass.css">
</head>

<body>
    <nav style="height: 100px;" cha-bg="surface-container" cha-row cha-justify="between" cha-align="center">
        <button cha-bg="transparent" cha-c="on-surface">Chametzz</button>
        <div cha-row>
            <button cha-bg="transparent" cha-c="on-surface">Proyectos</button>
            <button cha-bg="transparent" cha-c="on-surface">Tu mamá</button>
            <button cha-bg="transparent" cha-c="on-surface">Git</button>
        </div>
    </nav>
    <main cha-col cha-gap="md" cha-align="center">
        <aside data-theme="light" class="card" cha-bg="surface">
            <h2>Sección clara aislada</h2>
            <p>Texto oscuro sobre fondo claro.</p>
        </aside>
        <button>Cómo estás</button>
        <div style="height: 400px;" cha-col cha-bg="surface-container-lowest">
            <div cha-center cha-col cha-gap="md">
                <h1>Hola soy Chametzz</h1>
                <h2>Soy programador</h2>
            </div>
        </div>
        <div cha-col cha-align="center" cha-gap="md">
            <div cha-elevation="2" cha-p="xl" cha-bg="surface-container">
                <h1>Encabezado</h1>
            </div>
            <button cha-bd="primary" cha-bg="transparent" cha-c="primary">Outlined</button>
            <button cha-bg="primary">
                Filled
            </button>
            <button cha-bg="secondary" disabled>
                Tonal
            </button>
            <button cha-bg="transparent" cha-c="primary" disabled>
                Text
            </button>
            <input type="text">
            <input type="password">
            <input type="email">
            <input type="tel">
            <input type="url">
            <input type="search">

            <!-- 2. Entradas Numéricas y Controles -->
            <input type="number">
            <input type="range">

            <!-- 3. Selecciones de Opción -->
            <input type="checkbox">
            <input type="radio">

            <!-- 4. Fechas, Horas y Colores -->
            <input type="date">
            <input type="time">
            <input type="datetime-local">
            <input type="month">
            <input type="week">
            <input type="color">

            <!-- 5. Archivos y Carga -->
            <input type="file">

            <!-- 6. Botones integrados como Input -->
            <input type="submit">
            <input type="reset">
            <input type="button">
            <input type="image">

            <!-- 7. Entradas Ocultas -->
            <input type="hidden">

            <!-- 8. Elementos de Entrada Especiales -->
            <select>
                <option value="1">Opción 1</option>
                <option value="1">Opción 2</option>
            </select>

            <textarea></textarea>
        </div>
    </main>
</body>

</html>
